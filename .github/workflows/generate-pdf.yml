name: Generate Resume PDF and Push to CDN

on:
  push:
    paths:
      - 'content/Resume/Master_Resume.md'
      - 'quartz/**'
      - 'quartz.config.yaml'
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-and-push-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iamrp.dev
        uses: actions/checkout@v4
        with:
          path: 'iamrp'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Build
        working-directory: ./iamrp
        run: |
          npm ci
          npx quartz build

      - name: Generate PDF via Puppeteer
        working-directory: ./iamrp
        run: |
          npm install puppeteer
          node -e "
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const puppeteer = require('puppeteer');

          const publicDir = path.resolve('public');
          const server = http.createServer((req, res) => {
            let reqPath = req.url.split('?')[0];
            let filePath = path.join(publicDir, reqPath);
            if (fs.existsSync(filePath) && fs.statSync(filePath).isDirectory()) {
              filePath = path.join(filePath, 'index.html');
            } else if (!fs.existsSync(filePath) && fs.existsSync(filePath + '.html')) {
              filePath = filePath + '.html';
            }
            if (fs.existsSync(filePath) && !fs.statSync(filePath).isDirectory()) {
              res.writeHead(200);
              fs.createReadStream(filePath).pipe(res);
            } else {
              res.writeHead(404);
              res.end('Not Found');
            }
          });

          server.listen(8765, async () => {
            try {
              const browser = await puppeteer.launch({ 
                headless: 'new', 
                args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-gpu'] 
              });
              const page = await browser.newPage();
              await page.setViewport({ width: 1200, height: 1600 });
              await page.goto('http://127.0.0.1:8765/Resume/Master_Resume.html', { waitUntil: 'networkidle0' });
              await page.evaluate(() => {
                const hideSelectors = ['.sidebar', '.page-header', 'footer', '.toc', '.breadcrumb-container', '.footer-git-info', '.backlinks', '.graph'];
                hideSelectors.forEach(selector => {
                  document.querySelectorAll(selector).forEach(el => el.style.display = 'none');
                });
                const center = document.querySelector('.center');
                if (center) {
                    center.style.maxWidth = '100%';
                    center.style.width = '100%';
                    center.style.margin = '0';
                    center.style.padding = '20px';
                }
              });
              await page.pdf({ 
                  path: 'Richard_Dissell_Resume.pdf', 
                  format: 'Letter',
                  printBackground: true,
                  margin: { top: '0.4in', right: '0.4in', bottom: '0.4in', left: '0.4in' }
              });
              await browser.close();
              server.close();
              process.exit(0);
            } catch (err) {
              console.error(err);
              server.close();
              process.exit(1);
            }
          });
          "

      - name: Checkout CDN Repo
        uses: actions/checkout@v4
        with:
          repository: rpdev-cdn/cdn.iamrp.dev
          path: 'cdn'
          token: ${{ secrets.PAT_CDN_PUSH || secrets.GITHUB_TOKEN }}

      - name: Push PDF to CDN
        run: |
          mkdir -p cdn/pdf
          cp iamrp/Richard_Dissell_Resume.pdf cdn/pdf/
          cd cdn
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pdf/Richard_Dissell_Resume.pdf
          git commit -m "chore(pdf): auto-update resume PDF from iamrp.dev" || echo "No changes to commit"
          git push
