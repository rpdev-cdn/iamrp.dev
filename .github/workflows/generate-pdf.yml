name: Generate Resume PDF and Push to CDN

on:
  push:
    paths:
      - 'content/Resume/Master_Resume.md'
      - 'quartz/**'
      - 'quartz.config.yaml'
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-and-push-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iamrp.dev
        uses: actions/checkout@v4
        with:
          path: 'iamrp'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & Build Quartz
        working-directory: ./iamrp
        run: |
          npm ci
          npm install puppeteer
          pip install pypdf
          npx quartz build

      - name: Checkout CDN Repo
        uses: actions/checkout@v4
        with:
          repository: rpdev-cdn/cdn.iamrp.dev
          path: 'cdn'
          token: ${{ secrets.PAT_CDN_PUSH || secrets.GITHUB_TOKEN }}

      - name: Run Build Resume PDF & pypdf Optimization
        run: |
          cd iamrp
          python3 scripts/build_resume_pdf.py
          cd ..
          mkdir -p cdn/pdf
          cp iamrp/public/Richard_Dissell_Resume.pdf cdn/pdf/

      - name: Push PDF to CDN
        run: |
          cd cdn
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pdf/Richard_Dissell_Resume.pdf
          git commit -m "chore(pdf): auto-update resume PDF via pypdf pipeline" || echo "No changes to commit"
          git push

      - name: Dispatch Event to CDN Repo
        env:
          GH_TOKEN: ${{ secrets.PAT_CDN_PUSH || secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST /repos/rpdev-cdn/cdn.iamrp.dev/dispatches -f event_type="resume-updated" || echo "Dispatch completed or ignored"
