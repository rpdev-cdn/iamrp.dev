name: Generate Resume PDF and Push to CDN

on:
  push:
    paths:
      - 'content/Resume/Master_Resume.md'
      - 'scripts/build_resume_pdf.py'
      - '.github/workflows/generate-pdf.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-push-pdf:
    runs-on: ubuntu-latest
    env:
      PAT_CDN_PUSH: ${{ secrets.PAT_CDN_PUSH }}
    steps:
      - name: Checkout iamrp.dev
        uses: actions/checkout@v4
        with:
          path: 'iamrp'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pure-Python PDF Toolchain
        run: |
          pip install markdown weasyprint pypdf

      - name: Run Pure-Python Resume Build & pypdf Optimization
        run: |
          cd iamrp
          python3 scripts/build_resume_pdf.py

      - name: Upload Generated Resume PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: richard-dissell-resume-pdf
          path: iamrp/public/Richard_Dissell_Resume.pdf
          retention-days: 30

      - name: Checkout CDN Repo
        if: ${{ env.PAT_CDN_PUSH != '' }}
        uses: actions/checkout@v4
        with:
          repository: rpdev-cdn/cdn.iamrp.dev
          path: 'cdn'
          token: ${{ secrets.PAT_CDN_PUSH }}

      - name: Push PDF to CDN
        if: ${{ env.PAT_CDN_PUSH != '' }}
        run: |
          mkdir -p cdn/pdf
          cp iamrp/public/Richard_Dissell_Resume.pdf cdn/pdf/
          cd cdn
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pdf/Richard_Dissell_Resume.pdf
          git commit -m "chore(pdf): auto-update resume PDF via pure-python weasyprint + pypdf" || echo "No changes to commit"
          git push

      - name: Dispatch Event to CDN Repo
        if: ${{ env.PAT_CDN_PUSH != '' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_CDN_PUSH }}
        run: |
          gh api -X POST /repos/rpdev-cdn/cdn.iamrp.dev/dispatches -f event_type="resume-updated" || echo "Dispatch completed or ignored"

      - name: Note Cross-Repo Push Status
        if: ${{ env.PAT_CDN_PUSH == '' }}
        run: |
          echo "PAT_CDN_PUSH secret is not configured. PDF verified and uploaded as workflow artifact; rpdev-cdn/cdn.iamrp.dev syncs via generate-resume-pdf.yml."
